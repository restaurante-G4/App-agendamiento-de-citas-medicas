# Habilitar CORS para permitir peticiones desde Flutter Web
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.host=0.0.0.0

# Configuración de conexión a PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=1234
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bd_proyecto_salud

# Estrategia de Hibernate ORM
# Usamos 'update' para que cree o actualice las tablas sin borrar los registros cada vez que reinicies Quarkus
quarkus.hibernate-orm.database.generation=update

# Mostrar las consultas SQL en la consola para verificación
quarkus.hibernate-orm.log.sql=true